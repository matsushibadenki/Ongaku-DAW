[workspace]
resolver = "2"
members = [
    "crates/audio-types",
    "crates/daw-core",
    "crates/audio-clip",
    "crates/dsp",
    "crates/mixer",
    "crates/audio-file",
    "crates/streaming",
    "crates/waveform",
    "crates/automation",
    "crates/midi",
    "crates/daw-project",
    "crates/audio-engine",
    "crates/audio-backend",
    "crates/audio-backend-cpal",
    "crates/daw-app",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.93"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
